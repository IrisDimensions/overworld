name: Publish Unmarked Commit as Beta Pack

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: overworld-pack-publication
  cancel-in-progress: false

env:
  RELEASE_TAG: beta
  RELEASE_TITLE: Overworld Beta
  ASSET_PATH: overworld.zip
  PACK_DIMENSION: overworld
  IRIS_REPOSITORY: https://github.com/VolmitSoftware/Iris.git
  IRIS_REF: master

jobs:
  publish:
    name: Validate and archive unmarked master build
    runs-on: ubuntu-latest

    steps:
      - name: Check out triggering commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Detect stable release marker
        id: release_marker
        shell: bash
        run: |
          set -euo pipefail
          commit_message="$(git log -1 --format=%B HEAD)"

          if [[ "$commit_message" == *"V+"* ]]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "This exact commit contains V+; beta publication is skipped."
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build canonical flat-root archive
        if: steps.release_marker.outputs.found != 'true'
        shell: bash
        run: |
          set -euo pipefail
          remote_master_sha="$(git ls-remote origin refs/heads/master | cut -f1)"
          archive_sha="$(git rev-parse HEAD)"

          if [[ "$archive_sha" != "$remote_master_sha" ]]; then
            echo "Checked out commit $archive_sha does not match master head $remote_master_sha" >&2
            exit 1
          fi

          echo "ARCHIVE_SHA=$archive_sha" >> "$GITHUB_ENV"
          git archive --format=zip --output="$ASSET_PATH" HEAD
          unzip -t "$ASSET_PATH"
          unzip -Z1 "$ASSET_PATH" | grep -Fx "dimensions/overworld.json"

      - name: Set up Java 25
        if: steps.release_marker.outputs.found != 'true'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Validate candidate and run Studio generation, hydrology, and order probes
        if: steps.release_marker.outputs.found != 'true'
        shell: bash
        run: |
          set -euo pipefail
          candidate_root="${RUNNER_TEMP}/${PACK_DIMENSION}-candidate"
          iris_root="${RUNNER_TEMP}/iris-engine"
          mkdir -p "$candidate_root"
          unzip -q "$ASSET_PATH" -d "$candidate_root"
          git clone --depth 1 --single-branch --branch "$IRIS_REF" "$IRIS_REPOSITORY" "$iris_root"
          "$iris_root/gradlew" --no-daemon -p "$iris_root" :probe:genProbe \
            -PprobePack="$candidate_root" \
            -PprobeDimension="$PACK_DIMENSION" \
            -PprobeWarmupChunks=64 \
            -PprobeMeasuredChunks=256 \
            -PprobeStudio=true
          "$iris_root/gradlew" --no-daemon -p "$iris_root" :probe:hydrologyPackProbe \
            -PprobePack="$candidate_root" \
            -PprobeDimension="$PACK_DIMENSION" \
            -PprobeSeeds=1,19,331,1337 \
            -PprobeMinimumTileX=8 \
            -PprobeMaximumTileX=23 \
            -PprobeMinimumTileZ=8 \
            -PprobeMaximumTileZ=23 \
            -PprobeRequiredCoverage=SURFACE_POOL@water,RIFFLE@water,CASCADE@water,WATERFALL@water,UNDERGROUND_POOL@water,UNDERGROUND_DROP@water,COASTAL_GROTTO@water,MOUTH@water,SINKHOLE@water,INLAND_GROTTO@water,DEEP_POOL@deep_lava \
            -PprobeStudio=true
          "$iris_root/gradlew" --no-daemon -p "$iris_root" :probe:generationOrderProbe \
            -PprobePack="$candidate_root" \
            -PprobeDimension="$PACK_DIMENSION" \
            -PprobeSeed=77 \
            -PprobeMinimumChunkX=2048 \
            -PprobeMaximumChunkX=2051 \
            -PprobeMinimumChunkZ=2048 \
            -PprobeMaximumChunkZ=2051 \
            -PprobeParallelism=4 \
            -PprobeShuffleSeed=1337 \
            -PprobeMulticore=false \
            -PprobeStudio=true

      - name: Publish beta release
        if: steps.release_marker.outputs.found != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release_notes="Automated beta archive from master commit ${ARCHIVE_SHA}."

          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
            gh api \
              --method PATCH \
              "repos/${GITHUB_REPOSITORY}/git/refs/tags/${RELEASE_TAG}" \
              -f sha="$ARCHIVE_SHA" \
              -F force=true \
              >/dev/null
          else
            gh api \
              --method POST \
              "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f ref="refs/tags/${RELEASE_TAG}" \
              -f sha="$ARCHIVE_SHA" \
              >/dev/null
          fi

          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$ASSET_PATH" \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
            gh release edit "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$RELEASE_TITLE" \
              --notes "$release_notes" \
              --draft=false \
              --prerelease \
              --latest=false
          else
            gh release create "$RELEASE_TAG" "$ASSET_PATH" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --title "$RELEASE_TITLE" \
              --notes "$release_notes" \
              --prerelease \
              --latest=false
          fi

      - name: Report stable release handoff
        if: steps.release_marker.outputs.found == 'true'
        shell: bash
        run: |
          echo "Stable release workflow owns commit ${GITHUB_SHA}." >> "$GITHUB_STEP_SUMMARY"
